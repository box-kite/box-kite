<!doctype html>
<!-- The README banner. Re-render: node .github/assets/render-banner.mjs (writes banner.png beside this file). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../../pages/public/fonts/Inter/Inter-VariableFont_opsz,wght.ttf') format('truetype');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Source Code Pro';
        src: url('../../pages/public/fonts/Source_Code_Pro/SourceCodePro-VariableFont_wght.ttf') format('truetype');
        font-weight: 200 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
      }
      body {
        font-family: 'Inter', sans-serif;
        color: #f1f5f9;
        background:
          radial-gradient(900px 520px at 100% 0%, rgba(124, 58, 237, 0.28), transparent 70%),
          radial-gradient(700px 420px at 0% 100%, rgba(79, 70, 229, 0.22), transparent 70%), #05060f;
        padding: 64px 80px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand img {
        width: 58px;
        height: 58px;
      }
      .site {
        font-size: 24px;
        font-weight: 600;
        color: #a5b4fc;
      }
      h1 {
        margin-top: 64px;
        font-size: 74px;
        line-height: 1.04;
        font-weight: 800;
        letter-spacing: -0.035em;
      }
      h1 em {
        font-style: normal;
        background: linear-gradient(90deg, #818cf8, #c084fc);
        -webkit-background-clip: text;
        color: transparent;
      }
      p {
        margin-top: 20px;
        font-size: 28px;
        color: #94a3b8;
      }
      .code {
        margin-top: auto;
        align-self: flex-start;
        font-family: 'Source Code Pro', monospace;
        font-size: 23px;
        line-height: 1.55;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 14px;
        padding: 20px 28px;
      }
      .tag {
        color: #7dd3fc;
      }
      .attr {
        color: #c4b5fd;
      }
      .str {
        color: #86efac;
      }
      .bad {
        color: #fca5a5;
        text-decoration: underline wavy #f87171;
        text-decoration-thickness: 2px;
        text-underline-offset: 6px;
      }
      .error {
        color: #94a3b8;
        font-size: 20px;
      }
      .error b {
        color: #f87171;
        font-weight: 600;
      }
      .error i {
        font-style: normal;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><img src="../../pages/public/logo.svg" alt="" />Box Kite</div>
      <div class="site">box-kite.dev</div>
    </header>
    <h1>Every CSS property<br />is <em>a typed prop.</em></h1>
    <p>The React styling library your AI already knows.</p>
    <div class="code">
      <div>
        <span class="tag">&lt;Box</span> <span class="attr">p</span>={4} <span class="attr">bgColor</span>=<span class="bad str"
          >"bleu-500"</span
        >
        <span class="tag">/&gt;</span>
      </div>
      <div class="error"><b>✕ ts(2820)</b> Type '"bleu-500"' is not assignable… <i>Did you mean '"blue-500"'?</i></div>
    </div>
  </body>
</html>
