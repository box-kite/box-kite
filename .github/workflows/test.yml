name: Tests
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  checks:
    name: Compile, lint, build, package health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies 🔧
        run: npm ci
      - name: Check compiling 🔧
        run: npm run compile
      - name: Check linting 🔧
        run: npm run lint
      - name: Check core stays framework-free 🔧
        run: npm run check:boundaries
      # Both purges, one check: the old company and the old project name, over the tracked files
      # and over dist/ once it is built — four of those strings reach a consumer's console or files.
      - name: Check the old names stay gone 🔧
        run: npm run check:brand
      # The docs site's code blocks are strings, so nothing else compiles them. This does, against
      # the published entry points — the way the reader copying one would.
      - name: Check the docs snippets compile 🔧
        run: npm run check:docs
      # Every prop's `@example` is generated by running the engine, so this fails when a divider, a
      # formatter or a value list changes and the reference beside it did not.
      - name: Check the prop reference is current 🔧
        run: npm run check:props
      # The skill, the Cursor rule and the marketplace entry are generated from the rules file and the
      # prop reference, and an install command reads them out of this repository — so a hand-edit of one
      # is a claim nothing holds up.
      - name: Check the committed agent files are current 🔧
        run: npm run check:agents
      - name: Check build 🔧
        run: npm run build
      # The existence proof for the core boundary: a page with no framework, built against the
      # same sources. If the engine ever needs React again, this is what stops compiling.
      - name: Check the framework-free example builds 🔧
        run: npm run build:vanilla
      - name: Check package health (publint + attw) 🔧
        run: npm run check:package
      - name: Check size budgets 🔧
        run: npm run size
      # The prerender pass renders every route in Node, so this is the only thing in CI that puts a
      # DataGrid, a Dropdown or a chart through a server render — bug #85 was found by it and by no
      # test. It fails on a route that renders nothing, and it runs last because it is the slowest.
      - name: Check the docs site prerenders 🔧
        run: npm run build:pages

  next-app:
    # The RSC claim, end to end. The unit tests render with the client React, so only a real Next.js
    # server build can prove that the `react-server` condition resolves — for the entry and for the
    # pre-built components a Server Component imports — that React hoists the style elements into
    # <head>, and that a Suspense boundary's CSS streams with its markup.
    name: Box in a Server Component (Next.js)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies 🔧
        run: npm ci
      - name: Build the library 🔧
        run: npm run build
      # Packs dist/ and installs that tarball into the example, so the published exports map is what
      # decides which Box the server graph gets — not a path alias.
      - name: Build the example app 🔧
        run: npm run build:next-app
      - name: Check the served HTML 🔧
        run: npm run smoke:next-app

  test:
    # The peer range spans React 16.14 to 19, and the engine touches the parts React changed most
    # (layout effects, hydration, server rendering). Testing one version proves nothing about the
    # other, so every supported major runs the whole suite.
    name: Tests (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies 🔧
        run: npm ci
      - name: Pin React ${{ matrix.react }} 🔧
        run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - name: Check React version 🔧
        run: node -e "const v=require('react/package.json').version; console.log('react', v); if (!v.startsWith('${{ matrix.react }}.')) process.exit(1)"
      - name: Check testing and coverage budget 🔧
        run: npm run test:coverage
