# The release is a merged pull request. `npm run release -- minor` bumps package.json, turns
# releases/next.md into releases/<version>.md and opens the PR; when Tests go green on main and the
# version the manifest names has no tag yet, this tags it, opens the GitHub Release from the notes
# file, and hands the tag to publish.yml. A version already released only gets its release body
# re-synced from the file, so a typo fixed in releases/<version>.md reaches the release page on the
# next green main. Every step is idempotent, so a run that stopped halfway is simply run again.
name: Release

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  # The retry: the checks already ran on main, so this only redoes whatever the last run did not.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # The body is assembled by a script, so the Node the runner happens to ship is not the one that runs it.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Tag, release and publish the version the manifest names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          notes="releases/$version.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes does not exist — npm run release writes it, and the release PR carries it"
            exit 1
          fi

          # The body is a script, because the notes outgrew what a release body may hold: over GitHub's
          # 125,000-character cap it keeps Highlights, Breaking changes and Fixes and points the detail
          # at the site. The line it puts on top is the one thing the notes file cannot say about itself.
          body=$(mktemp)
          node scripts/release-body.mjs "$version" > "$body"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already tagged"
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" -m "Box Kite $version"
            git push origin "$tag"
            echo "tagged $tag"
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$body"
            echo "$tag is already released — its body now matches $notes"
            exit 0
          fi

          # The publish is dispatched whether or not the body was accepted: a release body is prose and
          # the two packages are the release. 2.0.0 tagged, took a 422 on an over-long body, and shipped
          # nothing at all — the tag then made it look done.
          released=1
          gh release create "$tag" --title "$version" --notes-file "$body" --latest || released=0

          # A release created with the workflow token fires no `release: published` run — GitHub's rule
          # against recursive workflows — so the publish is dispatched by name instead.
          gh workflow run publish.yml --ref main -f "ref=$tag"
          echo "dispatched publish.yml for $tag"

          if [ "$released" = 0 ]; then
            echo "::error::$tag is tagged and on its way to npm, but the GitHub Release could not be created"
            exit 1
          fi
          echo "released $tag"
